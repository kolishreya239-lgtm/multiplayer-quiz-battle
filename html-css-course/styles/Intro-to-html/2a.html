<!DOCTYPE html>
<html>
    <head>
        <title>
            2a exercise
        </title>
        <style>
    .uber-button {
        background-color: black;
        color: white;
        height: 40px;
        width: 110px;
        border: none;
        cursor: pointer;


    }

    .amazon-button {
        background-color: rgb(236, 236, 33);
        color: rgb(224, 125, 125);
        height: 30px;
        width: 150px;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        margin-left: 10px;
    }

    .github-button {
        background-color: rgb(46, 174, 79);
        color: white;
        height: 40px;
        width: 100px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 20px;
    }

    .bootstrap-button {
        background-color: rgb(121, 82, 179);
        color: white;
        height: 35px;
        width: 120px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 20px;
    }

    .download-button {
        background-color: rgb(108, 117, 125);
        color: white;
        height: 40px;
        width: 130px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 20px;
    }

    .linkedin-button {
        background-color: rgb(10, 102, 940);
        color: white;
        height: 40px;
        width: 200px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        margin-left: 20px;
    }

    .save-button {
        bsckground-color: white;
        color: blue;
        height: 40px;
        width: 80px;
        border: 2px solid rgb(90, 90, 240);
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        margin-left: 6px;
    }
</style>
        <body>
            <button class="uber-button">REQUEST NOW</button>
            <button class="amazon-button">add to cart</button>
            <button class="github-button">sign up</button>
            <button class="bootstrap-button">get started</button>
            <button>download</button>
            <button class="linkedin-button">apply on company website</button>
            <button class="save-button">save</button>



        </body>
    </head>
</html>
