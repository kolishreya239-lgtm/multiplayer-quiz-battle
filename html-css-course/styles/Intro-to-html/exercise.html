<style>

<style>
    .stretch-button {
        background-color: green;
        color: white;
        border: none;
        padding-top: 20px;
        padding-bottom: 20px;
        padding-left: 30px;
        padding-right: 30px;
        cursor: pointer;
        margin-left: 30px;
        font-size: 25px;
        transition: padding-top 0.15s,
            padding-bottom 0.15s,
            padding-left 0.15s,
            padding-right 0.15s;
    
        
    }

    .stretch-button:hover {
        padding-top: 18px;
        padding-bottom: 18px;
        padding-left: 36px;
        padding-right: 36px;
        
    }
</style>
<button class="stretch-button">stretch</button>


<style>

        padding-left: 30px;
