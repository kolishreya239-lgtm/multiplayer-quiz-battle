{% extends "base.html" %}

{% block title %}Register - QUIZ CLASH{% endblock %}

{% block content %}
<div class="container" style="max-width: 580px; padding: 3rem 1.5rem;">
  <div class="cyber-card cyber-card-glow">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="badge-cyber badge-purple"><i data-lucide="user-plus"></i> New Warrior</span>
      <h2 style="font-size: 1.8rem; font-weight: 900; margin-top: 0.5rem;">JOIN QUIZ CLASH</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">Register your tag and start climbing the leaderboards.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label">Battle Tag / Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. quantum_striker" required minlength="3" maxlength="20" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Email Address (Optional)</label>
        <input type="email" name="email" class="form-control" placeholder="e.g. pilot@arena.com" autocomplete="email">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <!-- Avatar Picker -->
      <div class="form-group">
        <label class="form-label">Choose Your Battle Avatar</label>
        <div class="avatar-grid">
          <label class="avatar-option">
            <input type="radio" name="avatar" value="cyber_ninja" checked>
            <div class="avatar-card">
              <span class="avatar-icon">🥷</span>
              <span class="avatar-name">Ninja</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="pixel_queen">
            <div class="avatar-card">
              <span class="avatar-icon">👑</span>
              <span class="avatar-name">Queen</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="neon_falcon">
            <div class="avatar-card">
              <span class="avatar-icon">🦅</span>
              <span class="avatar-name">Falcon</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="shadow_knight">
            <div class="avatar-card">
              <span class="avatar-icon">⚔️</span>
              <span class="avatar-name">Knight</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="code_wizard">
            <div class="avatar-card">
              <span class="avatar-icon">🧙‍♂️</span>
              <span class="avatar-name">Wizard</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="mecha_titan">
            <div class="avatar-card">
              <span class="avatar-icon">🤖</span>
              <span class="avatar-name">Mecha</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="quantum_ghost">
            <div class="avatar-card">
              <span class="avatar-icon">👻</span>
              <span class="avatar-name">Ghost</span>
            </div>
          </label>
          <label class="avatar-option">
            <input type="radio" name="avatar" value="turbo_fox">
            <div class="avatar-card">
              <span class="avatar-icon">🦊</span>
              <span class="avatar-name">Fox</span>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-cyber btn-cyber-primary btn-block" style="margin-top: 0.5rem;">
        <i data-lucide="check-circle-2"></i> Create Warrior Profile
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-cyan font-heading" style="font-weight: 700;">Login Here</a>
      &bull; Or <a href="{{ url_for('auth.guest_login') }}" class="text-purple font-heading">Try Guest Demo</a>
    </div>
  </div>
</div>
{% endblock %}
